<!-- Stack — a personal CashApp monitor for BTC + NVDA. Private, view-only, no purchasing. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stack</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap');

  :root{
    --eerie:#1C1E1C; --green:#7AF17A; --honeydew:#E6F4E9; --white:#FFFFFF;
    --bg:#1C1E1C; --bg-deep:#141613;
    --green-ink:#1f9d44;            /* legible green on light surfaces */
    --green-edge:#39b85a;           /* button 3D edge */
    --ink:#1C1E1C; --ink-mut:rgba(28,30,28,.56); --ink-faint:rgba(28,30,28,.34);
    --cream:#E6F4E9; --cream-mut:rgba(230,244,233,.62); --cream-faint:rgba(230,244,233,.34);
    --ui:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
    --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --ease:cubic-bezier(.22,1,.36,1); --back:cubic-bezier(.34,1.5,.5,1);
    --lift:0 1px 1px rgba(0,0,0,.05), 0 2px 4px rgba(0,0,0,.28), 0 16px 34px -14px rgba(0,0,0,.55);
    --lift-hi:0 1px 1px rgba(0,0,0,.05), 0 4px 8px rgba(0,0,0,.3), 0 26px 50px -18px rgba(0,0,0,.65);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg); color:var(--cream); font-family:var(--ui); -webkit-font-smoothing:antialiased;
    line-height:1.45; padding:0 0 110px; min-height:100vh; position:relative; overflow-x:hidden}
  /* faint price-line texture across the floor */
  body::before{content:""; position:fixed; left:0; right:0; bottom:0; height:42vh; z-index:0; pointer-events:none;
    background:
      radial-gradient(120% 80% at 50% 120%, rgba(122,241,122,.08), transparent 60%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='300'><polyline points='0,210 90,180 150,230 230,140 300,200 380,90 470,160 560,70 650,150 740,110 840,190 930,120 1020,170 1110,80 1200,150' fill='none' stroke='%237AF17A' stroke-opacity='0.10' stroke-width='3'/></svg>") bottom center / 1200px auto no-repeat;}
  .wrap{position:relative; z-index:1; max-width:820px; margin:0 auto; padding:0 20px}
  .mono{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em}

  /* shared tactile pieces */
  .fold{position:absolute; top:0; right:0; width:0; height:0; border-style:solid;
    border-width:0 26px 26px 0; border-color:transparent var(--green) transparent transparent;
    filter:drop-shadow(-2px 2px 2px rgba(0,0,0,.28)); z-index:2}
  .grip{width:13px; height:19px; flex:0 0 auto;
    background:radial-gradient(circle, currentColor 1.1px, transparent 1.5px) 0 0 / 5px 5px; opacity:.4}

  /* header */
  header{padding:30px 0 6px; display:flex; align-items:center; justify-content:space-between}
  .brand{display:flex; align-items:center; gap:11px; font-weight:800; font-size:22px; letter-spacing:-.02em; color:var(--white)}
  .mark{display:flex; align-items:flex-end; gap:3px; height:21px}
  .mark i{width:5px; border-radius:2px; display:block; transform-origin:bottom; animation:grow .7s var(--back) both}
  .mark i:nth-child(1){height:11px; background:var(--white); animation-delay:.05s}
  .mark i:nth-child(2){height:21px; background:var(--green); animation-delay:.13s}
  @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .tag{font-family:var(--mono); font-size:12px; color:var(--green); letter-spacing:.04em;
    background:rgba(122,241,122,.1); border:1px solid rgba(122,241,122,.3); padding:5px 11px; border-radius:999px}

  /* stage + hero (the one dark tile) */
  .stage{position:relative; margin-top:20px}
  .stage::before,.stage::after{content:""; position:absolute; left:50%; transform:translateX(-50%);
    border-radius:18px 18px 0 0; background:rgba(230,244,233,.06); z-index:0}
  .stage::before{width:88%; height:26px; top:-12px}
  .stage::after{width:76%; height:26px; top:-22px; background:rgba(230,244,233,.035)}
  .hero{position:relative; z-index:1; background:linear-gradient(165deg,#23261f,#191b17); border-radius:20px;
    padding:26px; box-shadow:var(--lift); display:grid; grid-template-columns:1fr auto; gap:24px; align-items:center;
    overflow:hidden; opacity:0; transform:translateY(16px); animation:rise .7s var(--ease) .05s forwards}
  .hero::after{content:""; position:absolute; width:280px; height:280px; right:-60px; top:-120px; border-radius:50%;
    background:radial-gradient(circle, rgba(122,241,122,.16), transparent 70%); pointer-events:none}
  .hhead{display:flex; align-items:center; gap:8px; color:var(--cream-faint); margin-bottom:14px}
  .hlabel{font-size:11px; text-transform:uppercase; letter-spacing:.16em}
  #heroTotal{font-family:var(--mono); font-weight:500; font-size:clamp(34px,8.5vw,50px); line-height:1; letter-spacing:-.03em; color:var(--white)}
  .hrow{display:flex; flex-wrap:wrap; align-items:center; gap:9px; margin-top:14px; min-height:26px}
  .delta{font-family:var(--mono); font-size:15px; display:inline-flex; align-items:center; gap:6px}
  .delta .arr{font-size:10px}
  .pill{font-family:var(--mono); font-size:12px; color:var(--cream-mut); padding:4px 11px; border-radius:999px;
    background:rgba(230,244,233,.07); border:1px solid rgba(230,244,233,.12)}
  .hero .pos{color:var(--green)} .hero .neg{color:var(--cream-mut)}
  .ringbox{display:flex; flex-direction:column; align-items:center; gap:10px; position:relative; z-index:1}
  .ring svg{display:block; filter:drop-shadow(0 6px 12px rgba(0,0,0,.5))}
  .ring-leg{display:flex; flex-direction:column; gap:6px; width:100%}
  .leg{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--cream-mut)}
  .leg .v{margin-left:auto; font-family:var(--mono); color:var(--white)}
  .leg .sw{width:9px; height:9px; border-radius:50%}

  /* tabs */
  nav.tabs{position:sticky; top:0; z-index:9; display:flex; gap:6px; margin-top:24px; padding:14px 0 12px;
    background:linear-gradient(var(--bg) 60%, transparent)}
  nav.tabs button{flex:1; background:rgba(230,244,233,.04); border:1px solid rgba(230,244,233,.08); color:var(--cream-mut);
    font-family:var(--ui); font-weight:600; font-size:14px; padding:11px 6px; border-radius:13px; cursor:pointer;
    transition:.25s var(--ease)}
  nav.tabs button[aria-selected="true"]{background:var(--green); color:var(--eerie); border-color:var(--green);
    box-shadow:0 3px 0 var(--green-edge), 0 8px 16px -6px rgba(122,241,122,.4)}
  nav.tabs button:focus-visible{outline:2px solid var(--green); outline-offset:3px}

  #view{animation:swap .42s var(--ease)}
  @keyframes swap{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
  @keyframes rise{to{opacity:1; transform:none}}

  /* tiles (light, floating) */
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:15px}
  .tile{position:relative; background:var(--white); color:var(--ink); border-radius:18px; padding:20px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), var(--lift); overflow:hidden;
    opacity:0; transform:translateY(14px); transition:opacity .55s var(--ease), transform .3s var(--ease), box-shadow .3s}
  .tile.in{opacity:1; transform:none}
  .tile.span2{grid-column:1 / -1}
  .tile.soft{background:var(--honeydew)}
  .thead{display:flex; align-items:center; gap:10px; margin-bottom:16px; color:var(--ink)}
  .thead .grip{color:var(--ink)}
  .tname{font-weight:700; font-size:15px; letter-spacing:-.01em}
  .ttic{color:var(--ink-faint); font-size:12px; font-family:var(--mono); margin-left:auto}
  h2.tt{margin:0; font-weight:700; font-size:16px; letter-spacing:-.01em; color:var(--ink)}
  .hint{color:var(--ink-mut); font-size:13px; margin:5px 0 16px; line-height:1.5}

  .asset:hover{transform:translateY(-3px); box-shadow:inset 0 1px 0 rgba(255,255,255,.9), var(--lift-hi)}
  .dot{width:11px; height:11px; border-radius:50%}
  .dot.btc{background:var(--ink)} .dot.nvda{background:var(--green-ink)}
  .bigval{font-family:var(--mono); font-weight:500; font-size:30px; letter-spacing:-.02em; line-height:1; color:var(--ink)}
  .subval{font-family:var(--mono); font-size:13px; margin-top:6px}
  .pos{color:var(--green-ink); font-weight:500} .neg{color:var(--ink-mut)}
  .metrics{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:18px}
  .metric .k{color:var(--ink-mut); font-size:11px; text-transform:uppercase; letter-spacing:.06em}
  .metric .v{font-family:var(--mono); font-size:15px; margin-top:3px; color:var(--ink)}

  /* forms */
  label.fld{display:block; margin-bottom:14px}
  label.fld .lab{display:block; color:var(--ink-mut); font-size:12px; margin-bottom:6px}
  input,select{width:100%; background:var(--honeydew); border:1.5px solid rgba(28,30,28,.1); color:var(--ink);
    font-family:var(--mono); font-size:15px; padding:12px 13px; border-radius:12px; transition:border-color .2s, box-shadow .2s}
  input::placeholder{color:var(--ink-faint)}
  input:focus,select:focus{outline:none; border-color:var(--green-ink); box-shadow:0 0 0 3px rgba(31,157,68,.16)}
  .row{display:grid; grid-template-columns:1fr 1fr; gap:13px}
  .seg{display:flex; gap:8px; margin-bottom:13px}
  .seg button{flex:1; background:var(--honeydew); border:1.5px solid rgba(28,30,28,.1); color:var(--ink-mut);
    font-family:var(--ui); font-weight:600; font-size:14px; padding:11px; border-radius:12px; cursor:pointer; transition:.18s var(--ease)}
  .seg button.on[data-v="BTC"],.seg button.on[data-v="buy"],.seg button.on[data-v="sell"]{
    border-color:var(--ink); color:var(--ink); background:#fff; box-shadow:0 2px 0 rgba(28,30,28,.18)}
  .seg button.on[data-v="NVDA"]{border-color:var(--green-ink); color:var(--green-ink); background:#fff; box-shadow:0 2px 0 var(--green-ink)}
  /* extruded 3D primary button */
  .btn{width:100%; border:none; cursor:pointer; font-family:var(--ui); font-weight:700; font-size:15px;
    padding:14px; border-radius:13px; margin-top:6px; color:var(--eerie); background:var(--green);
    box-shadow:0 5px 0 var(--green-edge), 0 10px 18px -8px rgba(122,241,122,.45);
    transition:transform .1s var(--ease), box-shadow .1s var(--ease)}
  .btn:hover{filter:brightness(1.03)}
  .btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--green-edge), 0 4px 10px -6px rgba(122,241,122,.4)}
  .btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--green-ink); outline-offset:3px}
  .implied{color:var(--ink-mut); font-size:12.5px; min-height:18px; margin:0 0 12px; font-family:var(--mono)}

  .prices{display:grid; grid-template-columns:1fr 1fr; gap:15px}
  .pricebox .lab{display:flex; align-items:center; gap:8px; color:var(--ink-mut); font-size:12px; margin-bottom:7px}
  .stamp{color:var(--ink-faint); font-size:12px; margin-top:14px; font-family:var(--mono); display:flex; align-items:center; gap:8px}
  .live{width:7px; height:7px; border-radius:50%; background:var(--green-ink); animation:pulse 2.4s infinite}
  .pricebtns{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px}
  .btn.ghost{background:#fff; color:var(--ink); box-shadow:0 4px 0 rgba(28,30,28,.16), 0 8px 14px -8px rgba(0,0,0,.3)}
  .btn.ghost:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(28,30,28,.16)}
  .srcbadge{margin-left:auto; font-family:var(--mono); font-size:11px; padding:3px 10px; border-radius:999px; border:1px solid}
  .srcbadge.live{color:var(--green-ink); border-color:rgba(31,157,68,.4); background:rgba(31,157,68,.08)}
  .srcbadge.manual{color:var(--ink-mut); border-color:rgba(28,30,28,.18)}
  details.setup{margin-top:16px; border-top:1px solid rgba(28,30,28,.1); padding-top:12px}
  details.setup summary{cursor:pointer; font-weight:700; font-size:13px; color:var(--ink); list-style:none}
  details.setup summary::-webkit-details-marker{display:none}
  details.setup summary::before{content:"+ "; color:var(--green-ink)}
  details.setup[open] summary::before{content:"– "}
  details.setup p{color:var(--ink-mut); font-size:12.5px; line-height:1.55; margin:11px 0}
  details.setup p b{color:var(--ink)}
  .note{font-size:11.5px; color:var(--ink-faint)!important}
  textarea{width:100%; min-height:84px; resize:vertical; background:var(--honeydew); border:1.5px solid rgba(28,30,28,.1);
    color:var(--ink); font-family:var(--mono); font-size:12px; line-height:1.5; padding:12px 13px; border-radius:12px;
    word-break:break-all; margin-bottom:12px; transition:border-color .2s, box-shadow .2s}
  textarea:focus{outline:none; border-color:var(--green-ink); box-shadow:0 0 0 3px rgba(31,157,68,.16)}
  .dangerzone{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px;
    border-top:1px solid rgba(28,30,28,.1); padding-top:16px}
  .btn.danger{background:#fff; color:#c23b22; box-shadow:0 4px 0 rgba(194,59,34,.25), 0 8px 14px -8px rgba(194,59,34,.3)}
  .btn.danger:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(194,59,34,.25)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,157,68,.45)}70%{box-shadow:0 0 0 8px rgba(31,157,68,0)}100%{box-shadow:0 0 0 0 rgba(31,157,68,0)}}

  /* activity list */
  ul.tx{list-style:none; margin:0; padding:0}
  ul.tx li{display:grid; grid-template-columns:auto 1fr auto auto; gap:13px; align-items:center;
    padding:13px 0; border-bottom:1px solid rgba(28,30,28,.09); animation:slidein .45s var(--ease) both}
  ul.tx li:last-child{border-bottom:none}
  @keyframes slidein{from{opacity:0; transform:translateX(-8px)}to{opacity:1; transform:none}}
  .txdate{color:var(--ink-faint); font-size:12px; font-family:var(--mono); white-space:nowrap}
  .txmain{font-size:14px; color:var(--ink)}
  .txmain b{font-weight:700}
  .txqty{font-family:var(--mono); font-size:12.5px; color:var(--ink-mut)}
  .txusd{font-family:var(--mono); font-size:14.5px; text-align:right; white-space:nowrap; color:var(--ink)}
  .del{background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:18px; padding:4px; line-height:1; transition:.2s}
  .del:hover{color:var(--ink); transform:scale(1.15)}
  .empty{text-align:center; color:var(--ink-mut); padding:32px 12px; font-size:14px; line-height:1.6}
  .empty b{color:var(--ink); display:block; font-weight:700; font-size:15px; margin-bottom:6px}

  /* projection */
  .chartwrap{margin:6px -6px 4px}
  svg.chart{width:100%; height:auto; display:block}
  .draw{stroke-dasharray:var(--len); stroke-dashoffset:var(--len); animation:draw 1.1s var(--ease) .1s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .areafill{opacity:0; animation:fade .9s ease .5s forwards}
  @keyframes fade{to{opacity:1}}
  table.proj{width:100%; border-collapse:collapse; margin-top:10px; font-family:var(--mono); font-size:13.5px; color:var(--ink)}
  table.proj th{text-align:right; color:var(--ink-mut); font-weight:600; font-size:11px; text-transform:uppercase;
    letter-spacing:.05em; padding:9px 6px; border-bottom:1.5px solid rgba(28,30,28,.12); font-family:var(--ui)}
  table.proj th:first-child,table.proj td:first-child{text-align:left}
  table.proj td{text-align:right; padding:10px 6px; border-bottom:1px solid rgba(28,30,28,.08)}
  table.proj tbody tr:last-child td{border-bottom:none}
  .assume{display:grid; grid-template-columns:1fr 1fr; gap:18px}
  .assume h3{margin:0 0 12px; font-size:13px; display:flex; align-items:center; gap:8px; font-weight:700; color:var(--ink)}
  .disclaimer{color:var(--ink-mut); font-size:12px; line-height:1.55; margin-top:16px; padding-top:15px; border-top:1px solid rgba(28,30,28,.1)}

  @media (max-width:600px){
    .hero{grid-template-columns:1fr; gap:18px}
    .ringbox{flex-direction:row; align-items:center; gap:16px}
    .ring-leg{width:auto}
    .grid{grid-template-columns:1fr}
    .row,.prices{grid-template-columns:1fr 1fr}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important; transition:none!important}
    .tile,.hero{opacity:1; transform:none} .draw{stroke-dashoffset:0} .areafill{opacity:1}
  }
</style>

<div class="wrap">
  <header>
    <div class="brand"><span class="mark"><i></i><i></i></span> Stack</div>
    <div class="tag">BTC · NVDA</div>
  </header>

  <div class="stage">
    <div class="hero">
      <span class="fold"></span>
      <div>
        <div class="hhead"><span class="grip" style="color:var(--cream)"></span><span class="hlabel">Portfolio value</span></div>
        <div id="heroTotal" class="mono">—</div>
        <div class="hrow" id="heroRow"></div>
      </div>
      <div class="ringbox">
        <div class="ring" id="heroRing"></div>
        <div class="ring-leg" id="heroLeg"></div>
      </div>
    </div>
  </div>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="overview" aria-selected="true">Overview</button>
    <button role="tab" data-tab="activity" aria-selected="false">Log</button>
    <button role="tab" data-tab="projections" aria-selected="false">Projections</button>
    <button role="tab" data-tab="data" aria-selected="false">Data</button>
  </nav>

  <main id="view"></main>
</div>

<script>
"use strict";
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const ASSETS = {
  BTC:  { name:"Bitcoin", tic:"BTC",  qd:8, cls:"btc",  col:"var(--ink)",      ring:"#FFFFFF" },
  NVDA: { name:"NVIDIA",  tic:"NVDA", qd:4, cls:"nvda", col:"var(--green-ink)", ring:"#7AF17A" },
};
const K = { tx:"stack:transactions", px:"stack:prices", pj:"stack:projection", cfg:"stack:config" };

let state = {
  tx:[], px:{BTC:null,NVDA:null,updatedAt:null,source:null},
  pj:{BTC:{ret:20,contrib:50}, NVDA:{ret:12,contrib:50}},
  cfg:{finnhubKey:""},
  tab:"overview", loaded:false, form:{asset:"BTC",type:"buy"},
};

/* storage — uses your Claude account when running inside Claude (syncs across
   devices), and falls back to this browser's local storage when the file is
   hosted/opened as a normal web page. Same file works in both places. */
const SYNCED = (typeof window!=="undefined") && window.storage && typeof window.storage.get==="function";
const store = {
  async get(key){
    if(SYNCED){ try{ const r=await window.storage.get(key); return r&&r.value?r.value:null; }catch(e){ return null; } }
    try{ return localStorage.getItem(key); }catch(e){ return null; }
  },
  async set(key,val){
    if(SYNCED){ try{ await window.storage.set(key,val); }catch(e){} return; }
    try{ localStorage.setItem(key,val); }catch(e){}
  },
};
async function load(){
  for(const [k,key] of [["tx",K.tx],["px",K.px],["pj",K.pj],["cfg",K.cfg]]){
    const raw=await store.get(key); if(raw){ try{ state[k]=JSON.parse(raw); }catch(e){} }
  }
  state.loaded=true; render();
  if(state.px.source==="live") refreshLive(true);   /* silent auto-refresh if previously opted in */
  startAuto();
}
async function save(which){
  const m={tx:[K.tx,state.tx],px:[K.px,state.px],pj:[K.pj,state.pj],cfg:[K.cfg,state.cfg]}[which];
  await store.set(m[0], JSON.stringify(m[1]));
}

/* live prices — BTC needs no key; NVDA uses a free Finnhub key. These calls
   work when the page is hosted/opened normally; inside the Claude preview the
   sandbox usually blocks them, so manual entry stays available as a fallback. */
async function fetchBTC(){
  try{ const j=await (await fetch("https://api.coinbase.com/v2/prices/BTC-USD/spot")).json();
    const p=parseFloat(j.data.amount); if(isFinite(p)&&p>0) return p; }catch(e){}
  try{ const j=await (await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd")).json();
    const p=j.bitcoin&&j.bitcoin.usd; if(isFinite(p)&&p>0) return p; }catch(e){}
  return null;
}
async function fetchNVDA(key){
  if(!key) return null;
  try{ const j=await (await fetch("https://finnhub.io/api/v1/quote?symbol=NVDA&token="+encodeURIComponent(key))).json();
    const p=j.c; if(isFinite(p)&&p>0) return p; }catch(e){}
  return null;
}
let fetching=false;
async function refreshLive(silent){
  if(fetching) return; fetching=true;
  const stamp=document.getElementById("pxStamp");
  if(stamp&&!silent) stamp.innerHTML='<span class="live"></span>Fetching live prices…';
  const [b,n]=await Promise.all([fetchBTC(), fetchNVDA(state.cfg.finnhubKey)]);
  let any=false;
  if(b!=null){ state.px.BTC=b; any=true; }
  if(state.cfg.finnhubKey && n!=null){ state.px.NVDA=n; any=true; }
  fetching=false;
  if(any){ state.px.updatedAt=new Date().toISOString(); state.px.source="live"; save("px"); renderHero(); render(); return; }
  if(!silent && stamp){
    stamp.innerHTML='<span class="live" style="background:#b59a00"></span>Couldn’t reach the price services — this is normal inside the Claude preview. Host the file (or type prices manually) and live updates will work.';
  }
}
let autoTimer=null;
function startAuto(){

  autoTimer=setInterval(()=>{ if(state.px.source==="live" && document.visibilityState==="visible") refreshLive(true); }, 120000);
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && state.px.source==="live") refreshLive(true); });
}

/* math */
function calcAsset(a){
  let qty=0,bought=0,qtyBought=0,withdrawn=0;
  for(const t of state.tx){ if(t.asset!==a)continue;
    if(t.type==="buy"){qty+=t.qty;bought+=t.usd;qtyBought+=t.qty;} else {qty-=t.qty;withdrawn+=t.usd;} }
  const avgCost=qtyBought>0?bought/qtyBought:0, costOfHoldings=qty*avgCost, price=state.px[a];
  const value=price!=null?qty*price:null, gain=value!=null?value-costOfHoldings:null;
  const gainPct=(value!=null&&costOfHoldings>0)?gain/costOfHoldings*100:null;
  return {qty,bought,withdrawn,avgCost,costOfHoldings,price,value,gain,gainPct};
}
function calcTotals(){
  let value=0,cost=0,deposited=0,withdrawn=0,any=false;
  for(const a of Object.keys(ASSETS)){ const c=calcAsset(a);
    deposited+=c.bought; withdrawn+=c.withdrawn; cost+=c.costOfHoldings;
    if(c.value!=null){value+=c.value; any=true;} }
  const gain=any?value-cost:null, gainPct=(any&&cost>0)?gain/cost*100:null;
  return {value:any?value:null,cost,deposited,withdrawn,net:deposited-withdrawn,gain,gainPct,any};
}

/* format */
const usd=n=>(n<0?"-":"")+"$"+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const usd0=n=>(n<0?"-":"")+"$"+Math.abs(Math.round(n)).toLocaleString("en-US");
const qtyfmt=(n,a)=>n.toLocaleString("en-US",{maximumFractionDigits:ASSETS[a].qd});
const pct=n=>(n>=0?"+":"")+n.toFixed(2)+"%";
const signed=n=>(n>=0?"+":"-")+"$"+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
function ago(iso){ if(!iso)return "never updated";
  const s=(Date.now()-new Date(iso))/1000;
  if(s<60)return "updated just now"; if(s<3600)return "updated "+Math.floor(s/60)+"m ago";
  if(s<86400)return "updated "+Math.floor(s/3600)+"h ago"; return "updated "+Math.floor(s/86400)+"d ago"; }

/* motion */
function countTo(el,to,fmt){
  if(RM||el._v===to){ el.textContent=fmt(to); el._v=to; return; }
  const from=el._v??0; el._v=to; const t0=performance.now(),d=750;
  (function step(t){ const p=Math.min(1,(t-t0)/d), e=1-Math.pow(1-p,3);
    el.textContent=fmt(from+(to-from)*e); if(p<1)requestAnimationFrame(step); })(performance.now());
}
function enter(scope){
  (scope||document).querySelectorAll(".tile:not(.in)").forEach((c,i)=>{
    c.style.transitionDelay=(RM?0:i*65)+"ms";
    requestAnimationFrame(()=>requestAnimationFrame(()=>c.classList.add("in"))); });
}

/* hero */
function renderHero(){
  const t=calcTotals();
  const el=document.getElementById("heroTotal");
  if(t.value==null){ el.textContent="—"; el._v=null; } else countTo(el,t.value,usd);
  const row=document.getElementById("heroRow");
  if(!state.tx.length){ row.innerHTML='<span class="pill">Add your first buy to begin</span>'; }
  else{
    let h="";
    if(t.gain!=null){ const up=t.gain>=0; h+=`<span class="delta ${up?'pos':'neg'}"><span class="arr">${up?'▲':'▼'}</span>${signed(t.gain)}${t.gainPct!=null?" · "+pct(t.gainPct):""}</span>`; }
    else h+='<span class="pill">Set prices to see gain</span>';
    h+=`<span class="pill">In ${usd0(t.net)}</span>`;
    row.innerHTML=h;
  }
  const seg={}; let tot=0;
  for(const a of Object.keys(ASSETS)){ const c=calcAsset(a);
    const w=c.value!=null?Math.max(0,c.value):Math.max(0,c.bought-c.withdrawn); seg[a]=w; tot+=w; }
  const ring=document.getElementById("heroRing"), leg=document.getElementById("heroLeg");
  if(tot<=0){ ring.innerHTML=""; leg.innerHTML='<span class="leg" style="color:var(--cream-faint)">No holdings yet</span>'; return; }
  const r=33,C=2*Math.PI*r,sz=86,cx=sz/2; let rot=-90, arcs="";
  for(const a of Object.keys(ASSETS)){ const A=ASSETS[a], f=seg[a]/tot, len=f*C;
    arcs+=`<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${A.ring}" stroke-width="10" stroke-linecap="round"
      transform="rotate(${rot} ${cx} ${cx})" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}"
      stroke-dashoffset="${RM?0:len.toFixed(2)}" style="transition:stroke-dashoffset .9s var(--ease)"/>`;
    rot+=f*360; }
  ring.innerHTML=`<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}">
    <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="10"/>${arcs}</svg>`;
  if(!RM) requestAnimationFrame(()=>requestAnimationFrame(()=>
    ring.querySelectorAll("circle[stroke-dashoffset]").forEach(c=>c.setAttribute("stroke-dashoffset","0"))));
  leg.innerHTML=Object.keys(ASSETS).map(a=>`<span class="leg"><span class="sw" style="background:${ASSETS[a].ring}"></span>${ASSETS[a].tic}<span class="v">${(seg[a]/tot*100).toFixed(0)}%</span></span>`).join("");
}

/* projection */
function projectSeries(months){
  const start={},rate={},contrib={};
  for(const a of Object.keys(ASSETS)){ const c=calcAsset(a);
    start[a]=c.value!=null?c.value:(c.qty>0&&c.avgCost?c.qty*c.avgCost:0);
    rate[a]=Math.pow(1+state.pj[a].ret/100,1/12)-1; contrib[a]=state.pj[a].contrib; }
  let v={...start}; const series=[];
  for(let m=0;m<=months;m++){ if(m>0)for(const a of Object.keys(ASSETS))v[a]=v[a]*(1+rate[a])+contrib[a]; series.push(v.BTC+v.NVDA); }
  return {series,startTotal:start.BTC+start.NVDA,monthlyContrib:contrib.BTC+contrib.NVDA};
}
function chartSVG(series){
  const W=680,H=210,P=8; const max=Math.max(...series),min=Math.min(...series,0);
  const x=i=>P+(W-2*P)*i/(series.length-1), y=v=>H-P-(H-2*P)*(v-min)/((max-min)||1);
  const line=series.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join(" ");
  const area=line+` L${x(series.length-1).toFixed(1)} ${H-P} L${x(0).toFixed(1)} ${H-P} Z`;
  let grid="";
  for(let k=1;k<=10;k++){ const i=k*12; if(i<series.length){ const xx=x(i);
    grid+=`<line x1="${xx}" y1="${P}" x2="${xx}" y2="${H-P}" stroke="rgba(28,30,28,.08)" stroke-width="1"/>`+
          `<text x="${xx}" y="${H-10}" fill="rgba(28,30,28,.4)" font-size="10" text-anchor="middle" font-family="var(--mono)">${k}y</text>`; }}
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Projected portfolio value">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(31,157,68,.28)"/><stop offset="100%" stop-color="rgba(31,157,68,0)"/></linearGradient></defs>
    ${grid}<path class="areafill" d="${area}" fill="url(#ga)"/>
    <path id="pline" class="draw" d="${line}" fill="none" stroke="var(--green-ink)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function projTable(series,startTotal,monthlyContrib){
  return [1,2,3,5,10].map(yr=>{ const v=series[yr*12], put=startTotal+monthlyContrib*yr*12, g=v-put;
    return `<tr><td>Year ${yr}</td><td>${usd0(v)}</td><td>${usd0(put)}</td>
      <td class="${g>=0?'pos':'neg'}">${g>=0?'+':'-'}$${Math.abs(Math.round(g)).toLocaleString('en-US')}</td></tr>`;}).join("");
}
function drawChart(){ const p=document.getElementById("pline"); if(!p||RM)return; p.style.setProperty("--len",p.getTotalLength()); }
function projections(){
  const {series,startTotal,monthlyContrib}=projectSeries(120);
  const v=document.getElementById("view");
  v.innerHTML=`<div class="grid">
    <div class="tile span2"><span class="fold"></span>
      <div class="thead"><span class="grip"></span><h2 class="tt">If you keep stacking…</h2></div>
      <p class="hint">A hypothetical path from where you stand today. These are your assumptions — guesses, not guarantees.</p>

      </div></div>
    <div class="tile span2"><span class="fold"></span>
      <h2 class="tt" id="projHead" style="margin-bottom:16px">Projected value · ${usd0(series[120])} in 10 years</h2>
      <div class="chartwrap" id="chartWrap">${chartSVG(series)}</div>
      <table class="proj"><thead><tr><th>Horizon</th><th>Value</th><th>Put in</th><th>Growth</th></tr></thead>
        <tbody id="projBody">${projTable(series,startTotal,monthlyContrib)}</tbody></table>
      <p class="disclaimer">This compounds your assumed annual return monthly and adds your monthly buys. Markets don't move in straight lines — BTC swings hard and NVDA is a single stock with real downside. A planning sketch, not financial advice.</p></div>

  enter(v); drawChart();

    state.pj[o][k]=isFinite(x)?x:0; save("pj"); upd(); };
  bind("rBTC","BTC","ret"); bind("cBTC","BTC","contrib"); bind("rNVDA","NVDA","ret"); bind("cNVDA","NVDA","contrib");
}

/* backup · restore · cleanup */
const b64enc=s=>btoa(unescape(encodeURIComponent(s)));
const b64dec=s=>decodeURIComponent(escape(atob(s)));
function exportObj(){ return {app:"stack", v:1, exportedAt:new Date().toISOString(), tx:state.tx, px:state.px, pj:state.pj, cfg:state.cfg}; }
function exportCode(){ return b64enc(JSON.stringify(exportObj())); }
function importData(raw){
  raw=(raw||"").trim(); if(!raw) return false;
  let json; try{ json=b64dec(raw); }catch(e){ json=raw; }
  let data; try{ data=JSON.parse(json); }catch(e){ try{ data=JSON.parse(raw); }catch(e2){ return false; } }
  if(!data || typeof data!=="object") return false;
  if(Array.isArray(data.tx)) state.tx=data.tx.filter(t=>t&&t.asset&&t.type&&isFinite(t.usd)&&isFinite(t.qty)).map(t=>({id:t.id||Date.now()+Math.random(),date:t.date,asset:t.asset,type:t.type,usd:+t.usd,qty:+t.qty}));
  if(data.px && typeof data.px==="object") state.px=Object.assign({BTC:null,NVDA:null,updatedAt:null,source:null},data.px);
  if(data.pj && typeof data.pj==="object") state.pj=data.pj;
  if(data.cfg && typeof data.cfg==="object") state.cfg=data.cfg;
  save("tx"); save("px"); save("pj"); save("cfg"); return true;
}
function downloadBackup(){
  const blob=new Blob([JSON.stringify(exportObj(),null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download="stack-backup-"+new Date().toISOString().slice(0,10)+".json"; document.body.appendChild(a); a.click();
  a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function dedupeTx(){
  const seen=new Set(), kept=[];
  for(const t of state.tx){ const k=[t.date,t.asset,t.type,t.usd,t.qty].join("|");
    if(seen.has(k)) continue; seen.add(k); kept.push(t); }
  const removed=state.tx.length-kept.length; state.tx=kept; if(removed) save("tx"); return removed;
}

      <p class="hint">You have <b>${n} ${n===1?'entry':'entries'}</b> logged. Saving never piles up copies — the app keeps one record and overwrites it, so storage stays tiny. The only thing that grows is your purchase log, and duplicates from double-tapping “Add” can be cleared in one go.</p>
      <button class="btn ghost" id="dedupeBtn">Remove duplicate entries</button>
      <div class="dangerzone">
        <button class="btn danger" id="clearTx">Delete all entries</button>
        <button class="btn danger" id="resetAll">Reset everything</button>
      </div>
      <div class="stamp" id="cuMsg"></div></div>
  </div>`;
  enter(v);
  const msg=(id,t)=>{ const e=document.getElementById(id); if(e) e.innerHTML='<span class="live"></span>'+t; };
  document.getElementById("copyBk").onclick=()=>{
    const ta=document.getElementById("bkCode");
    const done=()=>{ const b=document.getElementById("copyBk"); b.textContent="Copied!"; setTimeout(()=>b.textContent="Copy backup code",1600); };
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select();document.execCommand&&document.execCommand("copy");done();}); }
    else { ta.select(); document.execCommand&&document.execCommand("copy"); done(); }
  };
  document.getElementById("dlBk").onclick=downloadBackup;
  document.getElementById("rsBtn").onclick=()=>{
    if(importData(document.getElementById("rsCode").value)){ renderHero(); msg("rsMsg","Restored. Opening your overview…"); setTimeout(()=>{state.tab="overview"; render();},700); }
    else msg("rsMsg","That code didn't look right — check you copied the whole thing.");
  };
  document.getElementById("rsFile").onchange=e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>{ if(importData(String(r.result))){ renderHero(); msg("rsMsg","Restored from file. Opening your overview…"); setTimeout(()=>{state.tab="overview"; render();},700); } else msg("rsMsg","Couldn't read that file."); };
    r.readAsText(f);
  };
  document.getElementById("dedupeBtn").onclick=()=>{
    const removed=dedupeTx(); renderHero();
    msg("cuMsg", removed? `Removed ${removed} duplicate ${removed===1?'entry':'entries'}.` : "No duplicates found — you're clean.");
  };
  document.getElementById("clearTx").onclick=()=>{
    if(!confirm("Delete all logged purchases? Your prices and Finnhub key stay. This can't be undone.")) return;
    state.tx=[]; save("tx"); renderHero(); render();
  };
  document.getElementById("resetAll").onclick=()=>{
    if(!confirm("Reset everything — purchases, prices, projections, and saved key? This can't be undone.")) return;
    state.tx=[]; state.px={BTC:null,NVDA:null,updatedAt:null,source:null};
    state.pj={BTC:{ret:20,contrib:50},NVDA:{ret:12,contrib:50}}; state.cfg={finnhubKey:""};
    save("tx"); save("px"); save("pj"); save("cfg"); renderHero(); state.tab="overview"; render();
  };
}

/* shell */
function render(){
  if(!state.loaded){ document.getElementById("view").innerHTML='<div class="empty" style="color:var(--cream-mut)">Loading your data…</div>'; return; }
  renderHero();
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===state.tab));
  ({overview,activity,projections,data:dataTab}[state.tab])();
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{ state.tab=b.dataset.tab; render(); });
load();
</script>
